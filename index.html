<script>
  // script to open dialog box

  // document.getElementById('openDialogBtn').addEventListener('click', function() {

  // Get the position of the button
  // var btnPosition = document.getElementById('openDialogBtn').getBoundingClientRect();

  // Position the dialog container
  // dialogContainer.style.top = btnPosition.bottom + 'px';
  // dialogContainer.style.left =

  // Select the target element
const targetElement = document.querySelector('#game');

// Create a new MutationObserver
const observer = new MutationObserver((mutationsList, observer) => {
  // Loop through all mutations
  for(const mutation of mutationsList) {
    // Check if the display property was changed
    if (mutation.type === 'attributes' && mutation.attributeName === 'style') {
      const displayValue = targetElement.style.display;
      // Check if the display property is now set to "block"
      if (displayValue === 'block') {
        var dialogContainer = document.getElementById('dialogContainer');
            dialogContainer.style.display = 'block';
            // Get the position of the button
            // var btnPosition = document.getElementById('openDialogBtn').getBoundingClientRect();
            // Position the dialog container
            // dialogContainer.style.top = btnPosition.bottom + 'px';
            // dialogContainer.style.left = btnPosition.left + 'px';
          // Position the arrow
          var arrow = document.querySelector('.arrow');
          arrow.style.top = '-10px';
          arrow.style.left = 'calc(50% - 10px)';

          // Anime.js animation for popping effect
          anime({
            targets: '.dialog-container',
            scale: [0.5, 1],
            opacity: [0, 1],
            duration: 500,
            easing: 'easeOutQuint'
          });
                
              // Run your function here
          console.log('Display property changed to "block"');
        }
    }
  }
});
  
// Start observing the target element for attribute changes
observer.observe(targetElement, { attributes: true });
    
// });
document.getElementById('closeDialogBtn').addEventListener('click', function() {
  // Anime.js animation for hiding the dialog
  anime({
    targets: '.dialog-container',
    scale: [1, 0.5],
    opacity: [1, 0],
    duration: 500,
    easing: 'easeOutQuint',
    complete: function(anim) {
      document.getElementById('dialogContainer').style.display = 'none';
    }
  });
});

</script>
