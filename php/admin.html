<CTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prolific Participants</title>
<!-- Material Design CSS -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
<style>
    td[colspan="4"] {
        text-align: center;
        background-color: #acece6;
        border : 2px solid #acece6;
        border-radius: .5em;
        /* some small shadow material effect */
        box-shadow: 0 2px 3px rgba(0, 0, 0, 0.1);
    }
    /* Center the table */
    .center-table {
        margin: auto;
    }

    /* Custom style for progress bar container */
    .progress-container {
        width: 50%;
        margin: auto;
        margin-bottom: 20px;
    }
</style>
</head>

<body>
<div class="container">
    <h2 class="center-align">Prolific Participants</h2>
    <table id="table" class="striped centered responsive-table center-table">
        <!-- <thead>
            <tr>
                <th>Prolific ID</th>
                <th>Session</th>
                <th>Trial</th>
                <th>Progress</th>
            </tr>
        </thead> -->
        <tbody id="participants-body">
            <!-- Table body content will be added dynamically using JavaScript -->
        </tbody>
    </table>
</div>

<script>
    // Function to fetch data from PHP script and populate the table
    hashCode = function(s) {
      return s.split("").reduce(function(a, b) {
        a = ((a << 5) - a) + b.charCodeAt(0);
        return a & a;
      }, 0);
    }
 
    function fetchData() {
        fetch('admin.php')
            .then(response => response.json())
            .then(data => {
                var tableBody = document.getElementById("participants-body");
                // Clear table body
                tableBody.innerHTML = "";
                if (data.length > 0) {
                    // Loop through the data and append rows to the table
                    // there is a datetime field (standard mysql format) that can be used to sort the data
                    // first convert the datetime string to a Date object and then sort
                    data.forEach(item => {
                        item.datetime = new Date(item.datetime);
                    });
                    data.sort((a, b) => b.datetime - a.datetime);
                    // instead of having a column for datetime, you can also create a row displaying only the date for each particular day and then list the participants for that day
                    // you can use the date object to get the date in a specific format
                    data.forEach(item => {
                        // only keep the date part of the datetime string (Wed Apr 03 2024)
                        var date = item.datetime.toDateString();
                        var hash = hashCode(date);
                        var tableBody = document.getElementById(`tbody-${hash}`);
                        // check if a row for that date already exists
                        if (!document.getElementById(date)) {
                            // delete the table body variable if it exists
                            if (tableBody!=null && tableBody!=undefined){
                                delete tableBody;
                            }
                            var tableBody = document.createElement(`tbody`);
                            tableBody.id = `tbody-${hash}`;
                            // strings contains an invalid character when creating tablebody
                            // replace the invalid character with a valid one
                            var row = document.createElement("tr");
                            row.id = date;
                            row.innerHTML = `<td colspan="4"><h5>${date}</h5></td>`;
                            tableBody.appendChild(row);
                            var thead = document.createElement("tr");
                            thead.style.fontWeight = "bold";
                            thead.innerHTML = `<td>Prolific ID</td><td>Session</td><td>Trial</td><td>Progress</td>`;
                            tableBody.appendChild(thead);
                        }
                        
                        // if the row already exists, add the participant to that row
                        var row = document.createElement("tr");
                        row.innerHTML = `<td>${item.prolificID}</td><td>${item.session}</td><td>${item.t}</td><td>${createProgressBar(item.session, item.t)}</td>`;
                        tableBody.appendChild(row);
                        document.getElementById("table").appendChild(tableBody);
                    })
                } else {
                    // If no data returned, display a message
                    var row = document.createElement("tr");
                    row.innerHTML = '<td colspan="4">No participants found</td>';
                    tableBody.appendChild(row);
                }
            })
            .catch(error => console.error('Error:', error));
    }

    // Function to create progress bar
    function createProgressBar(session, t) {
        session = parseInt(session)
        t = parseInt(t)
        // Calculate progress percentage
        var totalTrials = 6 * 72; // Total trials: 6 sessions * 72 trials each
        var currentTrial = session * 72 + t + 1; // Current trial (starting from 1)
        var progressPercentage = parseInt((currentTrial / totalTrials) * 100);

        // Create progress bar HTML
        var progressBarHTML = `
            <div class="progress-container">
              <div class="progress">
                <div class="determinate" style="width: ${progressPercentage}%;"></div>
              </div>
              <span>${progressPercentage}%</span>
            </div>
        `;

        return progressBarHTML;
    }

    // Call the fetchData function when the page loads
    window.onload = fetchData;
</script>

<!-- Materialize JavaScript -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
</body>

</html>
